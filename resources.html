<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressources Éducatives & Épreuves - Niger Édu TV</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .resources-container {
            padding: 40px 5%;
            max-width: 1000px;
            margin: auto;
        }
        .pdf-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .pdf-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 5px solid #008751;
        }
        .pdf-card h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .pdf-card .badge {
            background: #e05206;
            color: white;
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 3px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            background: #008751;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>Niger<span>ÉduTV</span></h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="resources.html" class="active">Épreuves & PDFs</a></li>
                <li><a href="admin/login.html" class="admin-btn">Espace Admin</a></li>
            </ul>
        </nav>
    </header>

    <div class="resources-container">
        <h2>Anciennes Épreuves & Documents Éducatifs</h2>
        <p>Téléchargez gratuitement les épreuves de BAC, DEF et autres cours.</p>

        <div class="pdf-list" id="pdf-container">
            <p>Chargement des documents...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const pdfContainer = document.getElementById('pdf-container');

        // Karbo takardu daga Firestore
        db.collection('resources').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
            let htmlContent = '';
            if (snapshot.empty) {
                pdfContainer.innerHTML = '<p>Aucun document disponible pour le moment.</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                htmlContent += `
                    <div class="pdf-card">
                        <span class="badge">${item.category}</span>
                        <h3>${item.title}</h3>
                        <a href="${item.url}" target="_blank" class="download-btn">Télécharger PDF</a>
                    </div>
                `;
            });

            pdfContainer.innerHTML = htmlContent;
        });
    </script>
</body>
</html>
